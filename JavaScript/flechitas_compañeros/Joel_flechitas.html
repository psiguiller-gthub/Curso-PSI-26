<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portero de Discoteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }

        .seccion {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        button {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
        }

        button:hover {
            background-color: #45a049;
        }

        input {
            padding: 8px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        h3 {
            margin-top: 15px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        img {
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <h1> Portero de Discoteca</h1>

    <!-- Imagen nueva -->
    <div class="seccion">
        <img src="https://www.aprendedetoros.com/wp-content/uploads/2016/10/1-74.jpg"
             alt="Discoteca"
             width="300"
             height="200">
    </div>

    <!-- Sección 3: Mayor de edad + Portero discoteca -->
    <div class="seccion">
        <h2> Verificar acceso</h2>

        <input type="number"
               id="edad"
               placeholder="Ingresa tu edad"
               required>

        <br>

        <button type="button" id="btn-verificar">
            Verificar acceso
        </button>

        <h3 id="resultado-edad">
            Estado:
        </h3>
    </div>

    <script>

        // ========= FUNCIÓN: Mayor de edad + Portero =========

        const isMayorDeEdad = (edad) => edad >= 18;

        const porteroDiscoteca = (edad) => {

            if (isMayorDeEdad(edad)) {
                return " PUEDES PASAR - ¡Bienvenido a la discoteca!";
            } else {
                return " ACCESO DENEGADO - Eres menor de edad.";
            }

        };

        const botonVerificar =
            document.querySelector('#btn-verificar');

        const contenedorEdad =
            document.querySelector('#resultado-edad');

        botonVerificar.addEventListener('click', () => {

            const edadInput =
                document.querySelector('#edad');

            const edad =
                Number(edadInput.value);

            if (isNaN(edad) || edadInput.value === "") {

                contenedorEdad.textContent =
                    "Estado: Por favor ingresa una edad válida.";

                contenedorEdad.style.color = "red";

            } else if (edad < 0) {

                contenedorEdad.textContent =
                    "Estado: La edad no puede ser negativa.";

                contenedorEdad.style.color = "red";

            } else {

                const mensaje =
                    porteroDiscoteca(edad);

                contenedorEdad.textContent =
                    `Estado: ${mensaje}`;

                contenedorEdad.style.color =
                    edad >= 18 ? "green" : "red";
            }

        });

    </script>

</body>
</html>
